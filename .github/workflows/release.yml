name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Every commit and tag (goreleaser's changelog and version), no
          # blobs until checkout needs them: the full clone pulled every
          # .deb and wasm ever committed, 5.5 GB, and v4.126.0's job sat
          # in this step for 15 minutes (TODO 2026-10-26; fixed 2026-10-29).
          fetch-depth: 0
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
