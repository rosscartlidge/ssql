<!DOCTYPE html>
<html><body>
<iframe id="ex" src="exp_explore.html" style="width:1200px;height:800px"></iframe>
<pre id="results">RUNNING</pre>
<script>
const out = [];
function rec(name, ok, detail) { out.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : " :: " + detail)); }
async function pause(ms) {
    // Anchor to a real fetch so --virtual-time-budget doesn't skip the wait.
    try { await fetch('check.html?w=' + Math.random(), { cache: 'no-store' }); } catch (e) {}
    await new Promise(r => setTimeout(r, ms));
}
// Flush the async completion machinery (awaited executors) before
// asserting UI state; instant under virtual time.
async function settle() { for (let i = 0; i < 10; i++) await new Promise(r => setTimeout(r, 5)); }
async function run() {
    const frame = document.getElementById('ex');
    if (frame.contentDocument === null || frame.contentDocument.readyState !== 'complete') {
        await new Promise(r => frame.addEventListener('load', r, { once: true }));
    }
    const w = frame.contentWindow;
    for (let i = 0; i < 400; i++) {
        if (w.ssqlEngine || w.ssqlEngineError) break;
        try { await fetch('check.html?p=' + i, { cache: 'no-store' }); } catch (e) {}
        await new Promise(r => setTimeout(r, 50));
    }
    if (!w.ssqlEngine) { rec("engine-loads", false, w.ssqlEngineError || "never ready"); fin(); return; }
    rec("engine-loads", true);
    const DATA = [{name:'Alice',dept:'Eng',salary:95000},{name:'Bob',dept:'Sales',salary:65000},{name:'Carol',dept:'Eng',salary:105000},{name:'Dave',dept:'Sales',salary:70000}];
    const P = (ops) => w.ssqlEngine.pipeline(DATA, ops);
    try {
        const r1 = P([{op:'where', field:'dept', operator:'eq', value:'Eng'}]);
        rec("op-where", r1.length === 2 && r1.every(r => r.dept === 'Eng'), JSON.stringify(r1));
        const r2 = P([{op:'sort', field:'salary', desc:true}, {op:'limit', n:1}]);
        rec("op-sort-limit", r2.length === 1 && r2[0].name === 'Carol', JSON.stringify(r2));
        const r3 = P([{op:'group_by', groupFields:['dept'], aggs:[{func:'count'},{func:'sum', field:'salary', alias:'total'}]}]);
        const eng = r3.find(r => r.dept === 'Eng');
        rec("op-group-by", r3.length === 2 && eng && eng.count === 2 && eng.total === 200000, JSON.stringify(r3));
        const r4 = P([{op:'compute', name:'bonus', expr:'salary / 10'}]);
        rec("op-compute", r4.length === 4 && r4[0].bonus === r4[0].salary / 10, JSON.stringify(r4[0]));
        const r5 = P([{op:'window', windowConfigs:[{partitionBy:['dept'], orderBy:[{field:'salary', desc:true}], specs:[{type:'row_number', result:'rn'}]}]}]);
        rec("op-window", r5.length === 4 && r5.filter(r => r.rn === 1).length === 2, JSON.stringify(r5.map(r=>[r.name,r.rn])));
        const r6 = P([{op:'distinct', field:'dept'}]);
        rec("op-distinct", r6.length === 2, JSON.stringify(r6));
    } catch (e) { rec("ops", false, String(e)); }

    // --- Pipeline bar (shared ssql-ui layer) ---
    try {
        const doc = w.document;
        const ta = doc.getElementById('pipeline');
        const popup = () => doc.getElementById('completions');
        const popupOpen = () => popup().style.display === 'block';
        const items = () => [...popup().children].map(d => d.textContent);
        rec("bar-present", !!ta && ta.value.startsWith('ssql from data.jsonl'), ta ? ta.value : 'no textarea');

        // Field completion against the page's own data (schema path).
        ta.focus();
        ta.value = "ssql from data.jsonl | ssql where -if ";
        ta.selectionStart = ta.selectionEnd = ta.value.length;
        ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        await settle();
        rec("bar-field-completion", popupOpen() && items().includes("salary") && items().includes("dept"),
            popupOpen() ? items().join(",") : "no popup; status: " + doc.getElementById('status').textContent);
        if (popupOpen()) ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));

        // Help at the cursor renders into the output panel.
        ta.value = "ssql from data.jsonl | ssql group-by dept -count";
        ta.selectionStart = ta.selectionEnd = ta.value.length;
        await w.helpAtCursor();
        const helpText = doc.getElementById('output').textContent;
        rec("bar-help", /Count records|result/i.test(helpText), helpText.slice(0, 120));

        // Run feeds the grid (exploreSetRows records the row count).
        ta.value = "ssql from data.jsonl | ssql where -if dept eq Eng";
        for (let i = 0; i < 100 && !w.exploreSetRows; i++) { await new Promise(r => setTimeout(r, 50)); }
        w.exploreRunBar();
        rec("bar-run-grid", w.exploreLastRowCount === 2, "rows=" + w.exploreLastRowCount);

        // Upload a lookup file and JOIN it directly by name.
        w.ssqlUIWriteUpload('lookup.csv', 'dept,label\nEng,Engineering\nSales,GoToMarket\n');
        rec("bar-upload-listed", doc.getElementById('fileList').textContent.includes('lookup.csv'),
            doc.getElementById('fileList').textContent);
        ta.value = "ssql from data.jsonl | ssql join lookup.csv -using dept";
        w.exploreRunBar();
        rec("bar-upload-join", w.exploreLastRowCount === 4, "rows=" + w.exploreLastRowCount);

        // A run that writes a file surfaces the download bar (tee keeps
        // rows flowing AND snapshots).
        ta.value = "ssql from data.jsonl | ssql tee snap.jsonl";
        w.exploreRunBar();
        rec("bar-files-download",
            w.getComputedStyle(doc.getElementById('filesBar')).display !== 'none' &&
            doc.getElementById('filesBar').textContent.includes('snap.jsonl'),
            doc.getElementById('filesBar').textContent.slice(0, 100));
        // DFC117: the widget builder is GONE — the bar (real grammar,
        // real engine) is the only authoring surface. Assert the corpse
        // stays buried, then cover what the builder tests used to: the
        // same operations typed as text.
        rec("builder-widgets-gone",
            !doc.querySelector('.pipeline-step') && !doc.querySelector('.pipeline-actions'),
            "builder UI still present");
        ta.value = "ssql from data.jsonl | ssql where -if dept eq Eng | ssql sort salary -desc";
        w.exploreRunBar();
        rec("bar-where-sort-runs", w.exploreLastRowCount === 2, "rows=" + w.exploreLastRowCount);
        ta.value = "ssql from data.jsonl | ssql update -set note 'hello world' | ssql where -if note eq 'hello world'";
        w.exploreRunBar();
        rec("bar-quoted-value", w.exploreLastRowCount === 4, "rows=" + w.exploreLastRowCount);
        // Multi-line bar (DFC117): a pipeline broken at pipes across
        // lines is the same pipeline — newlines are whitespace.
        ta.value = "ssql from data.jsonl |\n  ssql where -if dept eq Eng |\n  ssql sort salary -desc";
        w.exploreRunBar();
        rec("bar-multiline-runs", w.exploreLastRowCount === 2, "rows=" + w.exploreLastRowCount);
        // DFC118 Phase 1: the pipeline MODEL and its round-trip laws.
        // parseModel(printModel(m)) must deep-equal m (print loses
        // nothing); printModel(parseModel(t)) must be idempotent
        // (canonicalization). Opaque stages (procsub, comments) must
        // survive verbatim — totality, never repair.
        {
            const corpus = [
                "ssql from data.jsonl | ssql where -if dept eq Eng",
                "ssql from data.jsonl | ssql where -if name eq 'Ann E' | ssql sort salary -desc",
                "ssql from data.jsonl |\n  ssql group-by dept -sum salary total",
                "ssql   from    data.jsonl",
                "ssql from data.jsonl | ssql update -set note '' | ssql where -if note eq ''",
                "ssql join <(ssql from kind.csv) -on a b",
                "ssql from x.csv # keep my comment",
                "ssql from data.jsonl | ssql where -if a gt 5 + -if b lt 3",
                "ssql from data.jsonl | ssql update -set msg 'it'\\''s'",
            ];
            let rtBad = [];
            for (const t of corpus) {
                const m = w.ssqlUIParseModel(t);
                const p = w.ssqlUIPrintModel(m);
                const m2 = w.ssqlUIParseModel(p);
                const p2 = w.ssqlUIPrintModel(m2);
                if (JSON.stringify(m) !== JSON.stringify(m2)) rtBad.push('law1: ' + t + ' :: ' + p);
                if (p !== p2) rtBad.push('law2: ' + t + ' :: ' + p + ' vs ' + p2);
            }
            rec("model-roundtrip-laws", rtBad.length === 0, rtBad.join(' || ').slice(0, 300));
            // The model's tokenizer IS the run path's tokenizer: an
            // empty quoted arg must survive to execution (was silently
            // dropped — terminal and browser disagreed on arity).
            ta.value = "ssql from data.jsonl | ssql update -set note '' | ssql where -if note eq ''";
            w.exploreRunBar();
            rec("empty-quoted-arg-executes", w.exploreLastRowCount === 4, "rows=" + w.exploreLastRowCount);
            const opq = w.ssqlUIParseModel("ssql join <(ssql from kind.csv) -on a b");
            rec("model-opaque-procsub", !!opq[0].text && opq[0].text.includes('<('), JSON.stringify(opq));
        }

        // DFC118 Phase 2: grid gestures are MODEL EDITS on the bar —
        // one model, one run path. Clicks WRITE the stages into the
        // bar (the GUI teaching the CLI), replace their own stages on
        // the next gesture, never touch user-authored text, and Copy
        // CLI reproduces the screen with no side-channel.
        ta.value = "ssql from data.jsonl | ssql where -if dept eq Eng";
        w.exploreRunBar();
        w.exploreApplyGridOps([{ op: 'sort', field: 'salary', desc: false }]);
        await pause(150);
        rec("grid-writes-into-bar",
            ta.value === "ssql from data.jsonl | ssql where -if dept eq Eng | ssql sort salary",
            ta.value);
        rec("grid-ops-compose-over-bar",
            w.exploreLastRowCount === 2, // bar's filter survives the click
            "rows=" + w.exploreLastRowCount);
        w.exploreApplyGridOps([{ op: 'sort', field: 'salary', desc: true }]);
        await pause(150);
        rec("grid-gesture-replaces-own-stages",
            ta.value === "ssql from data.jsonl | ssql where -if dept eq Eng | ssql sort salary -desc",
            ta.value);
        // A user edit of the appended stage makes it user-authored:
        // the next gesture must append, never remove the edit.
        ta.value = "ssql from data.jsonl | ssql where -if dept eq Eng | ssql sort salary -desc | ssql limit 1";
        w.exploreApplyGridOps([{ op: 'sort', field: 'name', desc: false }]);
        await pause(150);
        rec("grid-never-edits-user-text",
            ta.value.includes('| ssql limit 1') && ta.value.endsWith('| ssql sort name'),
            ta.value);
        w.exploreApplyGridOps([]);
        await pause(150);
        rec("grid-clear-restores-base",
            ta.value.endsWith('| ssql limit 1'),
            ta.value);
        // Enter runs the bar; Shift+Enter does not (it makes a newline).
        ta.value = "ssql from data.jsonl | ssql limit 1";
        ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await settle();
        rec("bar-enter-runs", w.exploreLastRowCount === 1, "rows=" + w.exploreLastRowCount);
        ta.value = "ssql from data.jsonl | ssql limit 3";
        ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true, cancelable: true }));
        await settle();
        rec("bar-shift-enter-does-not-run", w.exploreLastRowCount === 1, "rows=" + w.exploreLastRowCount);
        // Server mode (DFC108 2c) must be DORMANT in a standalone
        // artifact — the head row only appears when the URL carries a
        // head and /api/health answers. getComputedStyle, not inline
        // style (the files-bar lesson).
        // Optimizer on the tail: REAL wasm run of generate ssql; the
        // preview must show before/after and Apply must rewrite the bar.
        ta.value = 'ssql from data.jsonl | ssql sort salary -desc | ssql limit 2';
        w.exploreOptimizeTail();
        await settle();
        const optOut = doc.getElementById('output').textContent;
        // (No [rewrite-name] annotations on the wasm path — success
        // stderr is dropped by executePipeline; the before/after diff
        // carries the story. The HEAD path has annotations.)
        rec("tail-optimize-preview",
            optOut.includes('top 2 -field salary') && optOut.includes('before:'),
            JSON.stringify(optOut.slice(0, 200)));
        const applyBtn = [...doc.getElementById('output').querySelectorAll('button')]
            .find(b => b.textContent.startsWith('Apply'));
        rec("tail-optimize-apply-btn", !!applyBtn, "no Apply button");
        if (applyBtn) { applyBtn.click(); await settle(); }
        rec("tail-optimize-applied",
            ta.value === 'ssql from data.jsonl | ssql top 2 -field salary', ta.value);
        // No-rewrite case is honest, no Apply button offered.
        ta.value = 'ssql from data.jsonl | ssql limit 2';
        w.exploreOptimizeTail();
        await settle();
        rec("tail-optimize-honest-noop",
            doc.getElementById('output').textContent.includes('already in optimal form') &&
            ![...doc.getElementById('output').querySelectorAll('button')].some(b => b.textContent.startsWith('Apply')),
            doc.getElementById('output').textContent.slice(0, 120));

        rec("server-head-dormant",
            w.getComputedStyle(doc.getElementById('serverHead')).display === 'none',
            w.getComputedStyle(doc.getElementById('serverHead')).display);
    } catch (e) { rec("bar", false, String(e)); }
    // Server-mode flow: load the SAME artifact with ?file=…&srvtest=1
    // (the test hook skips the /api/health probe) and stub __srvFetch —
    // head run must land the envelope in data.jsonl and re-run the tail.
    try {
        const f2 = document.createElement('iframe');
        f2.style.cssText = 'width:1200px;height:700px';
        f2.src = document.getElementById('ex').getAttribute('src') + '?file=remote.csv&srvtest=1';
        document.body.appendChild(f2);
        await new Promise(r => f2.addEventListener('load', r, { once: true }));
        const w2 = f2.contentWindow;
        for (let i = 0; i < 400; i++) { if (w2.ssqlEngine || w2.ssqlEngineError) break; await pause(50); }
        const doc2 = w2.document;
        rec("server-head-visible",
            w2.getComputedStyle(doc2.getElementById('serverHead')).display !== 'none',
            w2.getComputedStyle(doc2.getElementById('serverHead')).display);
        rec("server-head-prefilled",
            doc2.getElementById('headInput').value === 'ssql from remote.csv',
            doc2.getElementById('headInput').value);
        const envelope = {
            output: '{"_schema":{"fields":["svc","n"],"types":{"svc":"string","n":"int"}}}\n' +
                    '{"svc":"api","n":41}\n{"svc":"web","n":7}\n',
            stderr: '', code: 0,
        };
        let fetched = null;
        w2.__srvFetch = (url, opts) => {
            fetched = { url: String(url), body: opts && opts.body };
            return Promise.resolve({ ok: true, json: () => Promise.resolve(envelope) });
        };
        doc2.getElementById('pipeline').value = 'ssql from data.jsonl | ssql sort n -desc';
        await w2.exploreRunHead();
        rec("server-head-posts-pipeline",
            fetched && fetched.url.includes('/api/execute') && fetched.body.includes('remote.csv'),
            JSON.stringify(fetched));
        // DFC117 follow-up (found by Ross: a huge head crashed the tab):
        // the EXECUTED head carries an implicit visible row cap; the
        // input text does not.
        rec("server-head-row-cap",
            fetched && fetched.body.includes('| ssql limit 10000') &&
            doc2.getElementById('headInput').value.indexOf('limit 10000') === -1,
            JSON.stringify(fetched && fetched.body));
        rec("server-head-feeds-tail", w2.exploreLastRowCount === 2, "rows=" + w2.exploreLastRowCount);
        // Head failure must surface, not silently keep stale data.
        w2.__srvFetch = () => Promise.resolve({ ok: true, json: () => Promise.resolve({ output: '', stderr: 'boom', code: 1 }) });
        await w2.exploreRunHead();
        rec("server-head-failure-loud",
            doc2.getElementById('status').textContent.includes('boom') ||
            doc2.getElementById('status').textContent.includes('Head failed'),
            doc2.getElementById('status').textContent);

        // Head-input completion over /api/cursor: the SAME machinery as
        // the tail bar, with an HTTP executor. The stub answers the
        // cursor protocol; Tab must pop SERVER file candidates and
        // accept into the head input.
        const cursorCalls = [];
        w2.__srvFetch = (url, opts) => {
            const u = String(url);
            if (u.includes('/api/cursor')) {
                const req = JSON.parse(opts.body);
                cursorCalls.push(req);
                const v = req.argv[0];
                let stdout = '';
                if (v === '-cursor-stage') stdout = req.argv[1];
                else if (v === '-complete') stdout = 'events-jan.csv\nevents-feb.csv\n';
                return Promise.resolve({ ok: true, json: () => Promise.resolve({ stdout, stderr: '', code: 0 }) });
            }
            return Promise.resolve({ ok: true, json: () => Promise.resolve({ output: '', stderr: '', code: 0 }) });
        };
        const hi = doc2.getElementById('headInput');
        hi.focus();
        hi.value = 'ssql from ';
        hi.selectionStart = hi.selectionEnd = hi.value.length;
        hi.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        await settle();
        const popup2 = doc2.getElementById('completions');
        const items2 = [...popup2.children].map(d => d.textContent);
        rec("head-complete-popup", popup2.style.display === 'block' && items2.includes('events-jan.csv'),
            popup2.style.display + " " + items2.join(","));
        rec("head-complete-protocol", cursorCalls.some(c => c.argv[0] === '-complete'),
            JSON.stringify(cursorCalls.map(c => c.argv[0])));
        // Passive popup: Tab accepts the highlighted candidate.
        hi.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        await settle();
        rec("head-complete-accept", hi.value === 'ssql from events-jan.csv ', JSON.stringify(hi.value));
        // Enter in the head input still runs the head (passive popup
        // closed; run listener respects completion's preventDefault).
        let ranHead = 0;
        const origRunHead = w2.exploreRunHead;
        w2.exploreRunHead = () => { ranHead++; };
        hi.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await settle();
        w2.exploreRunHead = origRunHead;
        rec("head-enter-still-runs", ranHead === 1, "ranHead=" + ranHead);
        // Head optimize: /api/optimize answers; preview + Apply rewrite
        // the HEAD input.
        w2.__srvFetch = (url, opts) => {
            const u = String(url);
            if (u.includes('/api/optimize')) {
                return Promise.resolve({ ok: true, json: () => Promise.resolve({
                    optimized: 'ssql from ssh node1 /data/x.csv -- where -if kind gt 100',
                    rewrites: ['[ssh-predicate-pushdown] where moves to the remote'],
                    changed: true }) });
            }
            return Promise.resolve({ ok: true, json: () => Promise.resolve({ output: '', stderr: '', code: 0 }) });
        };
        doc2.getElementById('headInput').value = 'ssql from ssh node1 /data/x.csv | ssql where -if kind gt 100';
        await w2.exploreOptimizeHead();
        await settle();
        const headOptOut = doc2.getElementById('output').textContent;
        rec("head-optimize-preview",
            headOptOut.includes('ssh-predicate-pushdown') && headOptOut.includes('after:'),
            headOptOut.slice(0, 160));
        const headApply = [...doc2.getElementById('output').querySelectorAll('button')]
            .find(b => b.textContent.startsWith('Apply'));
        if (headApply) { headApply.click(); await settle(); }
        rec("head-optimize-applied",
            doc2.getElementById('headInput').value === 'ssql from ssh node1 /data/x.csv -- where -if kind gt 100',
            doc2.getElementById('headInput').value);

        // Field-name completion in the head: the engine answers a field
        // slot with Use-Ctrl-O; the binding then asks -complete-source
        // for the upstream and /api/schema-fields for its output fields.
        w2.__srvFetch = (url, opts) => {
            const u = String(url);
            const req = JSON.parse(opts.body);
            if (u.includes('/api/cursor')) {
                const v = req.argv[0];
                let stdout = '';
                if (v === '-cursor-stage') stdout = req.argv[1].split('|').pop().trimStart();
                else if (v === '-complete-source') stdout = 'ssql from events.csv';
                else if (v === '-complete') stdout = 'Use-Ctrl-O\n';
                return Promise.resolve({ ok: true, json: () => Promise.resolve({ stdout, stderr: '', code: 0 }) });
            }
            if (u.includes('/api/schema-fields')) {
                return Promise.resolve({ ok: true, json: () => Promise.resolve({ fields: ['service', 'status', 'duration'] }) });
            }
            return Promise.resolve({ ok: true, json: () => Promise.resolve({ output: '', stderr: '', code: 0 }) });
        };
        hi.value = 'ssql from events.csv | ssql where -if ';
        hi.selectionStart = hi.selectionEnd = hi.value.length;
        hi.focus();
        hi.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        await settle();
        const items3 = [...doc2.getElementById('completions').children].map(d => d.textContent);
        rec("head-field-names", items3.includes('service') && items3.includes('duration'), items3.join(","));
        doc2.getElementById('completions').style.display = 'none';

        // Regression (found by Ross): a head run that CHANGES the output
        // fields must invalidate the tail's field-name cache — the cache
        // key ("ssql from data.jsonl") doesn't change, the file does.
        const ta2 = doc2.getElementById('pipeline');
        const tailFields = async () => {
            ta2.focus();
            ta2.value = 'ssql from data.jsonl | ssql where -if ';
            ta2.selectionStart = ta2.selectionEnd = ta2.value.length;
            ta2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
            await settle();
            const got = [...doc2.getElementById('completions').children].map(d => d.textContent);
            ta2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
            return got;
        };
        // Warm the cache on the CURRENT data.jsonl (svc/n from the first
        // head run), then re-run the head with DIFFERENT fields.
        const before2 = await tailFields();
        w2.__srvFetch = () => Promise.resolve({ ok: true, json: () => Promise.resolve({
            output: '{"_schema":{"fields":["region","total"],"types":{"region":"string","total":"int"}}}\n' +
                    '{"region":"emea","total":9}\n', stderr: '', code: 0 }) });
        doc2.getElementById('headInput').value = 'ssql from other.csv';
        await w2.exploreRunHead();
        const after2 = await tailFields();
        rec("head-refresh-invalidates-tail-fields",
            before2.includes('svc') && after2.includes('region') && !after2.includes('svc'),
            "before=" + before2.join(",") + " after=" + after2.join(","));

        // Server-files panel: click-to-load a side table into the vFS,
        // then JOIN it in the tail by name (direct-file join).
        w2.__srvFetch = (url) => {
            const u = String(url);
            if (u.includes('/api/files')) {
                return Promise.resolve({ ok: true, json: () => Promise.resolve({
                    files: [{ name: 'kind.csv', size: 120 }, { name: 'relationship.csv', size: 90 },
                            { name: 'huge.csv', size: 40 << 20 }] }) });
            }
            if (u.includes('/api/raw')) {
                return Promise.resolve({ ok: true, json: () => Promise.resolve({}),
                    text: () => Promise.resolve('region,label\nemea,Europe\napac,AsiaPac\n') });
            }
            return Promise.resolve({ ok: false, json: () => Promise.resolve({ error: 'unexpected' }) });
        };
        await w2.renderServerFiles();
        const sfSel = doc2.getElementById('serverFileSelect');
        const opts2 = [...sfSel.options];
        rec("server-files-listed",
            opts2.some(o => o.value === 'kind.csv') && opts2.some(o => o.value === 'relationship.csv'),
            opts2.map(o => o.value).join(","));
        rec("server-files-oversize-disabled",
            opts2.find(o => o.value === 'huge.csv').disabled === true &&
            opts2.find(o => o.value === 'kind.csv').disabled === false,
            opts2.map(o => o.value + ':' + o.disabled).join(","));
        // Multi-select BOTH loadable files, load in one go.
        opts2.find(o => o.value === 'kind.csv').selected = true;
        opts2.find(o => o.value === 'relationship.csv').selected = true;
        await w2.exploreLoadSelectedFiles();
        await settle();
        rec("server-file-loaded",
            doc2.getElementById('fileList').textContent.includes('kind.csv') &&
            doc2.getElementById('fileList').textContent.includes('relationship.csv'),
            doc2.getElementById('fileList').textContent);
        // data.jsonl currently holds {region:"emea",total:9} — join the
        // loaded side table by name, real wasm execution.
        ta2.value = 'ssql from data.jsonl | ssql join kind.csv -using region';
        w2.exploreRunBar();
        rec("server-file-joins", w2.exploreLastRowCount === 1, "rows=" + w2.exploreLastRowCount);

        // Regression (found by Ross): Tab on the join's RIGHT-side -on
        // field must complete from the right FILE — the engine hints
        // <right-field> there, which the trigger set didn't recognize
        // (^O worked in the CLI; browser Tab did nothing).
        ta2.focus();
        ta2.value = 'ssql from data.jsonl | ssql join kind.csv -on region ';
        ta2.selectionStart = ta2.selectionEnd = ta2.value.length;
        ta2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        await settle();
        const rightItems = [...doc2.getElementById('completions').children].map(d => d.textContent);
        rec("join-right-field-tab",
            rightItems.includes('region') && rightItems.includes('label'),
            rightItems.join(",") + " status=" + doc2.getElementById('status').textContent);
        ta2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));

        // Copy-as-CLI: head + (tail minus its data.jsonl source) as one
        // pipeline, with a loud note for browser-only files.
        doc2.getElementById('headInput').value = 'ssql from shuffled.csv | ssql limit 100000';
        ta2.value = 'ssql from data.jsonl | ssql join kind.csv -using region | ssql top -field n 5';
        w2.exploreCopyCli();
        rec("copy-cli-composes",
            w2.exploreLastCopiedCli === 'ssql from shuffled.csv | ssql limit 100000 | ssql join kind.csv -using region | ssql top -field n 5',
            w2.exploreLastCopiedCli);
        // Tail reading a real file directly IS the CLI pipeline.
        ta2.value = 'ssql from kind.csv | ssql limit 3';
        w2.exploreCopyCli();
        rec("copy-cli-direct-tail", w2.exploreLastCopiedCli === 'ssql from kind.csv | ssql limit 3',
            w2.exploreLastCopiedCli);
        // Browser-only file → warning in the status.
        w2.ssqlUIWriteUpload('laptop.csv', 'a\n1\n');
        ta2.value = 'ssql from data.jsonl | ssql join laptop.csv -using a';
        w2.exploreCopyCli();
        await settle();
        rec("copy-cli-warns-browser-only",
            doc2.getElementById('status').textContent.includes('laptop.csv exists only in this browser'),
            doc2.getElementById('status').textContent);

        // ⚡ typed toggle: the head run must carry engine=typed and the
        // status must report the honest compile/cache state.
        let typedUrl = '';
        w2.__srvFetch = (url) => {
            typedUrl = String(url);
            return Promise.resolve({ ok: true, json: () => Promise.resolve({
                output: '{"_schema":{"fields":["k"],"types":{"k":"int"}}}\n{"k":1}\n',
                stderr: '', code: 0, engine: 'typed-compiled', compileMs: 1600, runMs: 2340 }) });
        };
        doc2.getElementById('headTyped').checked = true;
        doc2.getElementById('headInput').value = 'ssql from big.csv | ssql limit 5';
        await w2.exploreRunHead();
        rec("head-typed-param", typedUrl.includes('engine=typed'), typedUrl);
        rec("head-typed-status",
            doc2.getElementById('status').textContent.includes('in 2.34s') &&
            doc2.getElementById('status').textContent.includes('+1.6s one-time compile'),
            doc2.getElementById('status').textContent);
        // Throughput display: inputRows in the envelope → "N → M rows
        // … (X rows/s)" in the status.
        w2.__srvFetch = () => Promise.resolve({ ok: true, json: () => Promise.resolve({
            output: '{"_schema":{"fields":["k"],"types":{"k":"int"}}}\n{"k":1}\n{"k":2}\n',
            stderr: '', code: 0, engine: 'typed-cached', compileMs: 0, runMs: 1650,
            inputRows: 14628366 }) });
        await w2.exploreRunHead();
        {
            const st5 = doc2.getElementById('status').textContent;
            rec("head-rows-per-sec",
                st5.includes('14.6M \u2192') && st5.includes('2 rows') && st5.includes('8.9M rows/s'),
                [st5.includes('14.6M \u2192'), st5.includes('2 rows'), st5.includes('8.9M rows/s'),
                 [...st5.slice(9, 20)].map(c => c.codePointAt(0).toString(16)).join(',')].join(' | '));
        }
        doc2.getElementById('headTyped').checked = false;

        // Share link: captures head + typed + loaded files + tail as a
        // #s= fragment; decoding restores the exact setup.
        doc2.getElementById('headInput').value = 'ssql from big.csv | ssql limit 9';
        doc2.getElementById('headTyped').checked = true;
        ta2.value = 'ssql from data.jsonl | ssql sort k';
        w2.exploreShareSetup();
        await settle();
        const su = w2.exploreLastShareUrl || '';
        let decoded = {};
        try {
            const frag = su.split('#s=')[1];
            decoded = JSON.parse(decodeURIComponent(escape(w2.atob(frag.replace(/-/g, '+').replace(/_/g, '/')))));
        } catch (e) {}
        rec("share-url-roundtrip",
            su.includes('#s=') && decoded.h === 'ssql from big.csv | ssql limit 9' &&
            decoded.y === true && decoded.t === 'ssql from data.jsonl | ssql sort k' &&
            Array.isArray(decoded.f) && decoded.f.includes('kind.csv'),
            su.slice(0, 80) + ' decoded=' + JSON.stringify(decoded));
        doc2.getElementById('headTyped').checked = false;

        // Restore: a fresh page with the fragment populates the inputs
        // even when the auto-runs fail (no server in the harness).
        const setupFrag = w2.btoa(unescape(encodeURIComponent(JSON.stringify(
            { h: 'ssql from other.csv | ssql limit 7', t: 'ssql from data.jsonl | ssql top -field n 3', y: true, f: [] }
        )))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const f3 = document.createElement('iframe');
        f3.style.cssText = 'width:1200px;height:700px';
        f3.src = document.getElementById('ex').getAttribute('src') + '?file=remote.csv&srvtest=1#s=' + setupFrag;
        document.body.appendChild(f3);
        await new Promise(r => f3.addEventListener('load', r, { once: true }));
        const w3 = f3.contentWindow;
        for (let i = 0; i < 400; i++) { if (w3.ssqlEngine || w3.ssqlEngineError) break; await pause(50); }
        await settle();
        const doc3 = w3.document;
        // Mobile layout: at phone width the container goes column-reverse
        // (data above the builder) and inputs hit 16px (iOS zoom guard).
        const f4 = document.createElement('iframe');
        f4.style.cssText = 'width:390px;height:700px';
        f4.src = document.getElementById('ex').getAttribute('src');
        document.body.appendChild(f4);
        await new Promise(r => f4.addEventListener('load', r, { once: true }));
        const w4 = f4.contentWindow;
        for (let i = 0; i < 100; i++) { if (w4.document.querySelector('.explorer-container')) break; await pause(50); }
        await settle();
        const cont4 = w4.document.querySelector('.explorer-container');
        // DFC117: single column everywhere — the panel (and the mobile
        // column-reverse flip that put data above it) is gone.
        rec("mobile-column-layout",
            !w4.document.querySelector('.left-panel') &&
            w4.getComputedStyle(cont4).flexDirection !== 'column-reverse',
            w4.getComputedStyle(cont4).flexDirection);
        rec("mobile-input-16px",
            w4.getComputedStyle(w4.document.getElementById('pipeline')).fontSize === '16px',
            w4.getComputedStyle(w4.document.getElementById('pipeline')).fontSize);
        // Swipes over the chart must scroll the page, not pan the plot:
        // touch-action pan-y on the frame, dragmode disabled in Plotly.
        rec("mobile-chart-pan-y",
            w4.getComputedStyle(w4.document.querySelector('.chart-area')).touchAction === 'pan-y',
            w4.getComputedStyle(w4.document.querySelector('.chart-area')).touchAction);
        let plot4 = null;
        for (let i = 0; i < 100; i++) {
            plot4 = w4.document.querySelector('.js-plotly-plot');
            if (plot4 && plot4._fullLayout) break;
            await pause(50);
        }
        rec("mobile-chart-dragmode-off",
            plot4 && plot4._fullLayout && plot4._fullLayout.dragmode === false,
            plot4 && plot4._fullLayout ? String(plot4._fullLayout.dragmode) : 'no plot');
        // Regression (found by Ross): fixed-height grid mode collapsed
        // the rows viewport to 0px on mobile — pagination footer visible,
        // rows invisible. autoHeight mode must give the rows real height.
        const vp4 = w4.document.querySelector('.ag-body-viewport');
        const rows4 = w4.document.querySelectorAll('.ag-row').length;
        rec("mobile-grid-rows-visible",
            vp4 && vp4.offsetHeight >= 42 && rows4 > 0,
            "viewport h=" + (vp4 && vp4.offsetHeight) + " rows=" + rows4);
        f4.remove();

        // Empty workspace (GET / flow): server mode reveals with NO url
        // head — the input prefills "ssql from " ready for Tab.
        const f5 = document.createElement('iframe');
        f5.style.cssText = 'width:1200px;height:600px';
        f5.src = 'exp_empty.html?srvtest=1'; // the REAL zero-record artifact
        document.body.appendChild(f5);
        await new Promise(r => f5.addEventListener('load', r, { once: true }));
        const w5 = f5.contentWindow;
        const errs5 = [];
        w5.addEventListener('error', e => errs5.push(String(e.message) + ' @ ' + String(e.error && e.error.stack).split('\n').slice(0,4).join(' <- ')));
        for (let i = 0; i < 400; i++) { if (w5.ssqlEngine || w5.ssqlEngineError) break; await pause(50); }
        await settle();
        rec("empty-workspace-head-ready",
            w5.getComputedStyle(w5.document.getElementById('serverHead')).display !== 'none' &&
            w5.document.getElementById('headInput').value === 'ssql from ',
            "display=" + w5.getComputedStyle(w5.document.getElementById('serverHead')).display +
            " head=" + JSON.stringify(w5.document.getElementById('headInput').value));
        // From EMPTY, a head run must light up the grid: rows AND columns.
        w5.__srvFetch = () => Promise.resolve({ ok: true, json: () => Promise.resolve({
            output: '{"_schema":{"fields":["svc","n"],"types":{"svc":"string","n":"int"}}}\n' +
                    '{"svc":"api","n":4}\n{"svc":"web","n":2}\n',
            stderr: '', code: 0, engine: 'exec', runMs: 12 }) });
        w5.document.getElementById('headInput').value = 'ssql from events.csv';
        await w5.exploreRunHead();
        await settle();
        const hdrs5 = [...w5.document.querySelectorAll('.ag-header-cell-text')].map(e => e.textContent);
        rec("empty-workspace-head-populates-grid",
            w5.exploreLastRowCount === 2 && hdrs5.includes('svc') && hdrs5.includes('n') &&
            w5.document.querySelectorAll('.ag-row').length === 2,
            "rows=" + w5.exploreLastRowCount + " headers=" + hdrs5.join(",") +
            " agrows=" + w5.document.querySelectorAll('.ag-row').length +
            " gridroot=" + !!w5.document.querySelector('.ag-root-wrapper') +
            " container=" + !!w5.document.querySelector('.explorer-container') +
            " setRows=" + typeof w5.exploreSetRows +
            " errs=" + errs5.join(" | ") +
            " status=" + w5.document.getElementById('status').textContent);
        f5.remove();

        rec("share-restore-inputs",
            doc3.getElementById('headInput').value === 'ssql from other.csv | ssql limit 7' &&
            doc3.getElementById('headTyped').checked === true &&
            doc3.getElementById('pipeline').value === 'ssql from data.jsonl | ssql top -field n 3',
            doc3.getElementById('headInput').value + ' | typed=' + doc3.getElementById('headTyped').checked +
            ' | tail=' + doc3.getElementById('pipeline').value);
    } catch (e) { rec("server-mode", false, String(e)); }
    fin();
}
function fin() { document.getElementById('results').textContent = "DONE\n" + out.join("\n"); }
run();
</script>
</body></html>
