<!DOCTYPE html>
<!--
  Headless end-to-end test of the WASM playground. Run via
  scripts/playground-test.sh (serves this dir, drives headless Chrome,
  greps the results). Exercises the REAL page in iframes: the
  help-at-cursor button (caret math + -cursor-stage/-help-at protocol
  through the WASM), the Alt-h keydown path, and share-link loading.

  Headless gotcha this harness works around: Chrome's
  - -virtual-time-budget fast-forwards timers, so a plain setTimeout poll
  expires before the real WASM fetch completes. Each poll iteration is
  anchored to a REAL network round-trip (virtual time pauses while a
  fetch is in flight). Readiness is probed via btnHelpAt.disabled — the
  page's `let wasmReady` is not a window property, so the parent frame
  can't see it.
-->
<html><body>
<iframe id="pg" src="playground.html" style="width:1200px;height:800px"></iframe>
<iframe id="pgshare" src="playground.html#p=c3NxbCBmcm9tIGVtcGxveWVlcy5jc3YKfCBzc3FsIGdyb3VwLWJ5IGRlcHQgLWNvdW50IGNudAp8IHNzcWwgdG8gdGFibGU" style="width:1200px;height:800px"></iframe>
<pre id="results">RUNNING</pre>
<script>
const out = [];
function record(name, ok, detail) {
    out.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : " :: " + detail));
}
async function waitReady(w) {
    for (let i = 0; i < 400; i++) {
        const btn = w.document.getElementById('btnHelpAt');
        if (btn && !btn.disabled) return true;
        try { await fetch('test-harness.html?ping=' + i, { cache: 'no-store' }); } catch (e) {}
        await new Promise(r => setTimeout(r, 50));
    }
    return false;
}
async function run() {
    const frame = document.getElementById('pg');
    if (frame.contentDocument === null || frame.contentDocument.readyState !== 'complete') {
        await new Promise(r => frame.addEventListener('load', r, { once: true }));
    }
    const w = frame.contentWindow;
    if (!(await waitReady(w))) {
        let st = "(no status)";
        try { st = w.document.getElementById('status').textContent; } catch (e) { st = "err: " + e; }
        record("wasm-init", false, "never ready; iframe status: " + st);
        finish(); return;
    }
    record("wasm-init", true);

    const doc = w.document;
    const ta = doc.getElementById('pipeline');
    const output = () => doc.getElementById('output').textContent;
    const label = () => doc.getElementById('outputLabel').textContent;

    // 1. Caret at end of "-sum salary" in a mid-pipeline group-by stage.
    const p1 = "ssql from employees.csv\n| ssql group-by dept -sum salary";
    ta.value = p1; ta.selectionStart = ta.selectionEnd = p1.length;
    w.helpAtCursor();
    record("flag-arg-help", output().includes("Sum field values"), output().slice(0, 200));

    // 2. Caret on an -if-expr expression argument -> functions reference appended.
    const p2 = "ssql from employees.csv | ssql where -if-expr 'salary > 5'";
    ta.value = p2; ta.selectionStart = ta.selectionEnd = p2.length;
    w.helpAtCursor();
    record("expr-arg-functions", output().includes("EXPRESSION FUNCTIONS AVAILABLE"), output().slice(0, 200));

    // 3. Caret mid-pipeline: end of FIRST stage while a second exists —
    //    must get help for `from`, not for the last stage.
    const p3 = "ssql from employees.csv | ssql to table";
    ta.value = p3; ta.selectionStart = ta.selectionEnd = "ssql from employees.csv".length;
    w.helpAtCursor();
    record("first-stage-help", /from|input|file/i.test(output()) && !/to table/.test(label()), label() + " :: " + output().slice(0, 200));

    // 4. Empty textarea -> friendly message, no crash.
    ta.value = ""; ta.selectionStart = ta.selectionEnd = 0;
    w.helpAtCursor();
    record("empty-message", output().includes("Put the cursor"), output().slice(0, 120));

    // 5. Alt-h keydown path reaches the same handler.
    const p5 = "ssql from employees.csv | ssql sort -desc salary";
    ta.value = p5; ta.selectionStart = ta.selectionEnd = p5.length;
    ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'h', altKey: true, bubbles: true }));
    record("alt-h-keydown", /descending|Sort/i.test(output()), output().slice(0, 200));

    // --- Tab completion ---
    const tab = (shift) => ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Tab', shiftKey: !!shift, bubbles: true, cancelable: true }));
    const key = (k) => ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    const popup = () => doc.getElementById('completions');
    const popupOpen = () => popup().style.display === 'block';
    const setLine = (s) => { ta.value = s; ta.selectionStart = ta.selectionEnd = s.length; };

    // 6. Single candidate: "ssql gr" + Tab -> "ssql group-by " inserted, no popup.
    setLine("ssql gr");
    tab();
    record("tab-single-insert", ta.value === "ssql group-by " && !popupOpen(), JSON.stringify(ta.value));

    // 7. Multi candidate: "ssql where -i" + Tab -> popup listing -if and -if-expr.
    setLine("ssql from employees.csv | ssql where -i");
    tab();
    const items = () => [...popup().children].map(d => d.textContent);
    record("tab-popup-multi", popupOpen() && items().includes("-if") && items().includes("-if-expr"), items().join(","));

    // 8. Navigate + Enter accepts the selected candidate.
    if (popupOpen()) {
        const want = items()[1];
        key('ArrowDown'); key('Enter');
        record("tab-accept-nav", !popupOpen() && ta.value.endsWith(want + " "), JSON.stringify(ta.value) + " want " + want);
    } else {
        record("tab-accept-nav", false, "popup was not open");
    }

    // 9. File completion lists the virtual FS: "ssql from csv " + Tab.
    setLine("ssql from csv ");
    tab();
    const fileOK = (popupOpen() && items().some(x => x.includes("employees.csv"))) || ta.value.includes("employees.csv");
    record("tab-file-vfs", fileOK, popupOpen() ? items().join(",") : JSON.stringify(ta.value));
    if (popupOpen()) key('Escape');
    record("tab-escape-closes", !popupOpen(), "popup still open");

    // 10. Field-name slot: the engine answers Use-Ctrl-O, and Tab
    //     transparently completes from the LIVE upstream schema instead —
    //     popup lists the employees.csv fields.
    setLine("ssql from employees.csv | ssql where -if ");
    tab();
    record("tab-field-auto", popupOpen() && items().includes("salary") && items().includes("dept"),
        popupOpen() ? items().join(",") : "no popup; status: " + doc.getElementById('status').textContent);
    if (popupOpen()) key('Escape');

    // 10b. Unique partial via explicit Ctrl-O: "sa" -> "salary ".
    setLine("ssql from employees.csv | ssql where -if sa");
    ta.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'o', ctrlKey: true, bubbles: true, cancelable: true }));
    record("ctrl-o-unique-insert", ta.value === "ssql from employees.csv | ssql where -if salary ", JSON.stringify(ta.value));

    // 10c. PIPELINE-AWARE: after a group-by, the schema is the grouped
    //      fields + aggregates — salary must be gone, cnt present.
    setLine("ssql from employees.csv | ssql group-by dept -count cnt | ssql sort ");
    tab();
    const pipeFields = popupOpen() ? items() : [];
    record("tab-field-pipeline-aware",
        popupOpen() && pipeFields.includes("cnt") && pipeFields.includes("dept") && !pipeFields.includes("salary"),
        pipeFields.join(","));
    if (popupOpen()) key('Escape');

    // 10d. Completing a data-file path must NOT surface the field_cache
    //      protocol directive as a candidate (it used to appear as
    //      {"type":"field_cache",...} in the popup) — single candidate
    //      inserts cleanly.
    setLine("ssql from csv cu");
    tab();
    record("tab-file-no-directive-junk",
        ta.value === "ssql from csv customers.csv " && !popupOpen(),
        JSON.stringify(ta.value) + (popupOpen() ? " popup: " + items().join(",") : ""));

    // 10e. ...and the directive it carries enables downstream VALUE
    //      completion: values of `country` from the cached file.
    setLine("ssql from csv customers.csv | ssql where -if country eq ");
    tab();
    const valueOK = (popupOpen() && items().includes("US")) || / US $/.test(ta.value) || ta.value.endsWith("US ");
    record("tab-value-completion", valueOK,
        popupOpen() ? items().join(",") : JSON.stringify(ta.value));
    if (popupOpen()) key('Escape');

    // 11. Generate Typed Go: derived row struct + typed runtime calls;
    //     record-mode Generate Go must NOT have them (discriminates the
    //     SSQL_MODE=typed env plumbing).
    setLine("ssql from employees.csv | ssql where -if age gt 30 | ssql to table");
    w.generateGo('typed');
    const typedSrc = doc.getElementById('output').textContent;
    record("generate-typed-go",
        /EmployeesRow/.test(typedSrc) && /typed\./.test(typedSrc) && /typed mode/.test(typedSrc),
        typedSrc.slice(0, 250));
    w.generateGo();
    const recSrc = doc.getElementById('output').textContent;
    record("generate-record-go-unchanged",
        /ssql\.GetOr|ssql\.Where/.test(recSrc) && !/typed\./.test(recSrc),
        recSrc.slice(0, 250));

    // 12. Full pipeline run with process substitution — guards the
    //     polyfill's /dev/fd FIFO detection (join's procsub handling)
    //     after the path-normalization change.
    setLine("ssql from orders.csv | ssql join <(ssql from customers.csv) -using customer_id | ssql limit 3 | ssql to table");
    w.runPipeline();
    record("procsub-join-run", /customer_id|country|amount/.test(doc.getElementById('output').textContent) && !/Error|failed/i.test(doc.getElementById('output').textContent),
        doc.getElementById('output').textContent.slice(0, 200));

    // 12. Share link (#p=... on the second iframe): pipeline preloaded and
    //    auto-run — output is the group-by result table.
    const w2 = document.getElementById('pgshare').contentWindow;
    if (await waitReady(w2)) {
        const o2 = w2.document.getElementById('output').textContent;
        const ta2 = w2.document.getElementById('pipeline').value;
        record("share-link-autorun",
            ta2.includes("group-by dept -count cnt") && /Engineering/.test(o2) && /cnt/.test(o2),
            "textarea: " + ta2.slice(0, 60) + " :: output: " + o2.slice(0, 120));
    } else {
        record("share-link-autorun", false, "share iframe never ready");
    }

    finish();
}
function finish() {
    document.getElementById('results').textContent = "DONE\n" + out.join("\n");
}
run();
</script>
</body></html>
